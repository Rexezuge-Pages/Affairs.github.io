      const d=document.createElement('div');d.className='quiz-q searchable';d.dataset.i=q.idx;
      const typeName={single:'单选',multi:'多选',judge:'判断'}[q.t];
      const catName={fin:'金融时政',law:'法律',new:'新增/时政',geo:'科技地理'}[q.c];
      let opts=q.o.map((o,j)=>{
        const input=q.t==='multi'?`<input type="checkbox" data-j="${j}">`:`<input type="radio" name="q${q.idx}" data-j="${j}">`;
        return `<label>${input} ${String.fromCharCode(65+j)}. ${o}</label>`;
      }).join('');
      d.innerHTML=`<div class="muted" style="font-size:12px">${k+1}. ${typeName} · ${catName} · No.${q.idx+1}</div><b>${q.q}</b><div class="opts" style="margin-top:8px">${opts}</div>
      <div class="toolbar"><button class="btn" onclick="this.closest('.quiz-q').classList.add('show')">看解析</button>
      <button class="btn ghost" onclick="this.closest('.quiz-q').classList.remove('show')">隐藏</button></div>
      <div class="ans">✅ 答案：${ansText(q)}<br>📖 解析：${q.e}</div>`;
      list.appendChild(d);
      // 恢复作答
      const sv=store[q.idx];
      if(sv!==undefined){
        d.querySelectorAll('input').forEach(inp=>{
          const j=+inp.dataset.j;
          inp.checked=q.t==='multi'?sv.includes(j):sv===j;
        });
      }
      d.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{
        if(q.t==='multi'){
          const sel=[...d.querySelectorAll('input:checked')].map(x=>+x.dataset.j).sort();
          store[q.idx]=sel;
        }else store[q.idx]=+d.querySelector('input:checked').dataset.j;
        save();
      }));
    });
    save();
  }
  function ansText(q){
    if(q.t==='multi') return q.a.map(j=>String.fromCharCode(65+j)).join('');
    if(q.t==='judge') return q.a===0?'√ 正确':'× 错误';
    return String.fromCharCode(65+q.a)+' '+q.o[q.a];
  }
  window.ansText=ansText;
  function submit(){
    let ok=0, done=0;
    const items=[...list.querySelectorAll('.quiz-q')];
    // 清除旧标记
    items.forEach(d=>d.classList.remove('correct','wrong'));
    items.forEach(d=>{
      const idx=+d.dataset.i, q=BANK[idx], sv=store[idx];
      if(sv===undefined) return;
      done++;
      let right=false;
      if(q.t==='multi') right=JSON.stringify((sv||[]).slice().sort())===JSON.stringify(q.a.slice().sort());
      else right=sv===q.a;
      d.classList.add('show',right?'correct':'wrong');
      if(right){ok++;const wi=wrong.indexOf(idx);if(wi>=0)wrong.splice(wi,1);}
      else if(!wrong.includes(idx))wrong.push(idx);
    });
    save();
    const card=document.getElementById('resultCard');
    card.style.display='block';
    card.innerHTML=`<h3>📊 本次判分：${ok} / ${items.length}（已答${done}）</h3><p class="muted">多选少选错选不得分 · 红色为答错已进错题本，绿色为答对 · 可点左侧“错题本”专项重练</p>`;
    scoreChip.textContent=`得分：${ok}/${items.length}`;
    card.scrollIntoView({behavior:'smooth'});
  }
  document.getElementById('submitBtn').onclick=submit;
  document.getElementById('shuffleBtn').onclick=()=>{BANK.sort(()=>Math.random()-.5);render();};
  document.getElementById('showAllBtn').onclick=()=>document.querySelectorAll('.quiz-q').forEach(d=>d.classList.add('show'));
  document.getElementById('resetBtn').onclick=()=>{localStorage.removeItem('affairs-answers');localStorage.removeItem('affairs-wrong');for(const k in store)delete store[k];wrong.length=0;render();scoreChip.textContent='得分：未交卷';};
  document.querySelectorAll('[data-f]').forEach(a=>a.onclick=e=>{e.preventDefault();f=a.dataset.f;render();});
  document.querySelectorAll('[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();tp=a.dataset.t;render();});
  document.getElementById('q').addEventListener('input',render);
  render();
})();
</script>
</body>
</html>
